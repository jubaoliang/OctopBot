# Release: a `v*` tag is the publish button.
# Tag push → gates → Android release APK built with Gradle → attached to the GitHub Release.
#
# Android is built on a GitHub runner with no Expo account involved. iOS is not built:
# it needs an Apple Developer account ($99/yr) for any real-device or distribution
# build, so that decision stays open until iOS actually ships.
#
# One-time setup before the first release — four repo secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# The keystore is a container, not the identity: the signing key lives in the PEM
# pair (`release-key.pem` + `release-cert.pem`, both plain text). Rebuild the
# container whenever a build needs it, then push the secrets:
#   KEYSTORE_PASSWORD=... scripts/keystore-from-pem.sh --force
#   base64 -i release.keystore | tr -d '\n' | gh secret set ANDROID_KEYSTORE_BASE64
#   gh secret set ANDROID_KEYSTORE_PASSWORD
#   gh secret set ANDROID_KEY_ALIAS
#   gh secret set ANDROID_KEY_PASSWORD
#
# Back the PEM pair up somewhere durable, as text. Never mint a new key pair:
# a different key cannot update this app under the same package name again.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create / update the GitHub Release

env:
  # versionCode = VERSION_CODE_BASE + github.run_number. run_number restarts at 1 if
  # this workflow file is deleted and recreated, so raise the base to stay above
  # whatever versionCode is already installed or published.
  VERSION_CODE_BASE: 0
  # Release builds only need the ABI families real phones use; dropping the emulator
  # ABIs roughly halves the native compile time.
  REACT_NATIVE_ARCHITECTURES: arm64-v8a,armeabi-v7a

# Never cancel a release build mid-flight; queue instead.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches version, gates pass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Tag matches app.json and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(node -p 'require("./app.json").expo.version')"
          pkg="$(node -p 'require("./package.json").version')"
          echo "tag=$tag app.json=$app package.json=$pkg"
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app.json ($app) and package.json ($pkg)"
            exit 1
          fi

      - name: Version sync
        run: pnpm run check:version

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --ci --coverage=false

  build-android:
    name: Android release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check ANDROID_KEYSTORE_BASE64 "$KEYSTORE_B64"
          check ANDROID_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD"
          check ANDROID_KEY_ALIAS "$KEY_ALIAS"
          check ANDROID_KEY_PASSWORD "$KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repo secret(s):$missing"
            echo "A release APK must be signed with the real keystore — a debug-signed build is not distributable. See the setup block at the top of this file."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Set versionCode
        run: |
          VC=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          echo "versionCode=$VC (base $VERSION_CODE_BASE + run $GITHUB_RUN_NUMBER)"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          VC="$VC" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android = config.expo.android || {};
            config.expo.android.versionCode = Number(process.env.VC);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          # versionCode is written into app.json just above, so the tree is dirty by
          # design; never let a git-status prompt block a non-interactive run.
          EXPO_NO_GIT_STATUS: '1'

      - name: Configure release signing
        run: python3 scripts/configure-android-signing.py

      - name: Gradle assembleRelease
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the debug key — refusing to publish it"
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/octopbot-${GITHUB_REF_NAME#v}-android.apk"
          echo "APK=$RUNNER_TEMP/octopbot-${GITHUB_REF_NAME#v}-android.apk" >> "$GITHUB_ENV"

      - name: Job summary
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo
            echo "- versionCode: \`$VERSION_CODE\` (base $VERSION_CODE_BASE + run $GITHUB_RUN_NUMBER)"
            echo "- ABIs: \`$REACT_NATIVE_ARCHITECTURES\`"
            echo "- APK SHA-256: \`$(shasum -a 256 "$APK" | cut -d' ' -f1)\`"
            echo "- iOS: not built — needs an Apple Developer account before it can be distributed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/*.apk
          retention-days: 30

      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Android"
            echo
            echo "- \`$(basename "$APK")\` — signed release APK, versionCode \`$VERSION_CODE\`"
            echo "- SHA-256: \`$(shasum -a 256 "$APK" | cut -d' ' -f1)\`"
            echo "- Install: \`adb install -r $(basename "$APK")\`"
            echo
            echo "iOS is not built for this release."
          } >> "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$APK" --clobber
