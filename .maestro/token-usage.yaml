# Token usage: drawer → Token 统计 → switch range → back.
# Dev client against a signed-in Octop instance with the usage ledger.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
- tapOn:
    id: 'header-menu'
- tapOn:
    id: 'drawer-tokens'
- extendedWaitUntil:
    visible:
      id: 'usage-total'
    timeout: 30000
# Range chips — labels are locale-dependent; hit the control by index after total is up.
- tapOn:
    id: 'header-back'
- assertVisible:
    id: 'header-menu'
- assertVisible:
    id: 'tab-me'
