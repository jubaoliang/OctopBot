# Connect apps: drawer entry renders the capability cards; the calendar
# card expands on connect with the sync-now row (no per-calendar picks —
# every readable calendar feeds the digest).
# Seed a session first when needed: octopbot://dev-session?url=…&token=…
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
- tapOn:
    id: 'header-menu'
- tapOn:
    id: 'drawer-connect'
- extendedWaitUntil:
    visible:
      id: 'connect-calendar-card'
    timeout: 30000
- assertVisible:
    id: 'connect-contacts-card'
- assertVisible:
    id: 'connect-phone-card'
- tapOn:
    id: 'connect-calendar-switch'
# Android 13+/16 runtime prompts: grant when they appear (emulator/phone).
- tapOn:
    text: 'While using the app'
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'connect-calendar-sync-now'
    timeout: 20000
- tapOn:
    id: 'connect-calendar-switch'
