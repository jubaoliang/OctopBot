# Composer attach + voice controls (attach needs a selected expert).
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
# Ensure an expert is selected so attach is wired on chat home.
- tapOn:
    id: 'tab-experts'
- extendedWaitUntil:
    visible:
      id: 'experts-list'
    timeout: 30000
- tapOn:
    text: '.*Case Support Desk.*'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 60000
- assertVisible:
    id: 'composer-attach'
- assertVisible:
    id: 'composer-voice'
- tapOn:
    id: 'composer-attach'
- extendedWaitUntil:
    visible:
      id: 'composer-attach-tray'
    timeout: 10000
- assertVisible:
    id: 'composer-attach-library'
- assertVisible:
    id: 'composer-attach-camera'
- assertVisible:
    id: 'composer-attach-files'
# Dismiss by toggling + again (inline tray, not a modal scrim).
- tapOn:
    id: 'composer-attach'
- assertNotVisible:
    id: 'composer-attach-tray'
- assertVisible:
    id: 'composer-attach'
