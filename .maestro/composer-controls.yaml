# Composer attach + voice controls (attach needs a selected expert).
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
# Ensure an expert is selected so attach is wired on chat home.
- tapOn:
    id: 'tab-experts'
- extendedWaitUntil:
    visible:
      id: 'experts-list'
    timeout: 30000
- tapOn:
    text: '.*Case Support Desk.*'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 60000
- assertVisible:
    id: 'composer-attach'
- assertVisible:
    id: 'composer-voice'
- tapOn:
    id: 'composer-attach'
- extendedWaitUntil:
    visible: '相册|Photos'
    timeout: 10000
- assertVisible: '拍照|Camera'
- assertVisible: '文件|Files'
# Dismiss by tapping outside: iOS is a system menu, other targets a sheet.
- tapOn:
    point: '50%,20%'
- assertNotVisible: '相册|Photos'
- assertVisible:
    id: 'composer-attach'
