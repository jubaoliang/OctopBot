# Thread pin/delete through the long-press action sheet (no swipe buttons).
# Requires at least one task-tree thread in the drawer.
# Locale-agnostic: actions are matched by id, not by zh/en labels.
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
- tapOn:
    id: 'header-menu'
- extendedWaitUntil:
    visible:
      id: 'drawer-tasks'
    timeout: 15000
# Groups start expanded (the drawer is a task switcher), so the first
# group's thread rows are already on screen — no expand tap needed.
- scrollUntilVisible:
    element:
      id: 'drawer-thread-.*'
    direction: DOWN
    timeout: 20000
- longPressOn:
    id: 'drawer-thread-.*'
- extendedWaitUntil:
    visible:
      id: 'thread-actions'
    timeout: 8000
# Pin/Unpin and Delete, Cancel in its own card.
- assertVisible:
    id: 'thread-actions-0'
- assertVisible:
    id: 'thread-actions-1'
- assertVisible:
    id: 'thread-actions-cancel'
- tapOn:
    id: 'thread-actions-cancel'
- assertNotVisible:
    id: 'thread-actions'
