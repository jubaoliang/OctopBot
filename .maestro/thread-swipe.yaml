# Thread pin/delete via long-press action menu (more reliable than swipe).
# Requires at least one task-tree thread in the drawer.
# Locale-agnostic: zh/en labels via regex.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
- tapOn:
    id: 'header-menu'
- extendedWaitUntil:
    visible:
      id: 'drawer-tasks'
    timeout: 15000
# Expand the first expert group under Tasks (agent id varies by server).
- tapOn:
    id: 'drawer-group-.*'
- scrollUntilVisible:
    element:
      id: 'drawer-thread-.*'
    direction: DOWN
    timeout: 20000
- longPressOn:
    id: 'drawer-thread-.*'
- extendedWaitUntil:
    visible: '.*(Pin|置顶).*'
    timeout: 8000
- assertVisible: '.*(Delete|删除).*'
- tapOn: '.*(Cancel|取消).*'
