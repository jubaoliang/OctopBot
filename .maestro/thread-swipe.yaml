# Thread pin/delete: swipe reveals Mail-style actions; long-press is the AX fallback.
# Requires at least one task-tree thread in the drawer.
# Locale-agnostic: zh/en labels via regex.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
- tapOn:
    id: 'header-menu'
- extendedWaitUntil:
    visible:
      id: 'drawer-tasks'
    timeout: 15000
# Expand the first expert group under Tasks (agent id varies by server).
- tapOn:
    id: 'drawer-group-.*'
- scrollUntilVisible:
    element:
      id: 'drawer-thread-.*'
    direction: DOWN
    timeout: 20000
# Leading swipe → pin action.
- swipe:
    from:
      id: 'drawer-thread-.*'
    direction: RIGHT
    duration: 500
- extendedWaitUntil:
    visible:
      id: 'drawer-pin-.*'
    timeout: 5000
- assertVisible: '.*(Pin|置顶|Unpin|取消置顶).*'
- tapOn:
    id: 'drawer-thread-.*'
- waitForAnimationToEnd:
    timeout: 1500
# Trailing swipe → delete action.
- swipe:
    from:
      id: 'drawer-thread-.*'
    direction: LEFT
    duration: 500
- extendedWaitUntil:
    visible:
      id: 'drawer-delete-.*'
    timeout: 5000
- assertVisible: '.*(Delete|删除).*'
- takeScreenshot: thread-swipe-delete
# Close without deleting, then verify long-press menu still works.
- tapOn:
    id: 'drawer-thread-.*'
- waitForAnimationToEnd:
    timeout: 1500
- longPressOn:
    id: 'drawer-thread-.*'
- extendedWaitUntil:
    visible: '.*(Pin|置顶).*'
    timeout: 8000
- assertVisible: '.*(Delete|删除).*'
- tapOn: '.*(Cancel|取消).*'
