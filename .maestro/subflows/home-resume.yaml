# Reach the chat home from any restored tab or thread. The tab bar exists
# on every tab, so waiting for it covers cold-start bundle load; the chat
# tab then reaches home from any tab (and returns to the list from a thread).
appId: com.tencent.octopbot
---
- extendedWaitUntil:
    visible:
      id: 'tab-chat'
    timeout: 180000
- runFlow:
    when:
      notVisible:
        id: 'select-expert'
    commands:
      - tapOn:
          id: 'tab-chat'
- extendedWaitUntil:
    visible:
      id: 'select-expert'
    timeout: 30000
