# Best-effort teardown for routine-builder: delete any briefing rows left
# behind by a mid-flow failure, so automation-starters (which requires the
# E2E expert to have no jobs) is not poisoned. Every step is optional —
# this hook must never fail, whatever screen the flow died on. Long-press
# targets rows by id (the name Text is not independently long-clickable).
appId: com.tencent.octopbot
---
- tapOn:
    id: 'tab-automation'
    optional: true
- runFlow:
    when:
      visible:
        id: 'automation-job-.*'
    commands:
      - longPressOn:
          id: 'automation-job-.*'
          optional: true
      - tapOn:
          id: 'routine-actions-0'
          optional: true
      - assertNotVisible:
          id: 'routine-actions'
          optional: true
      - tapOn:
          text: 'Delete|删除'
          optional: true
- runFlow:
    when:
      visible:
        id: 'automation-job-.*'
    commands:
      - longPressOn:
          id: 'automation-job-.*'
          optional: true
      - tapOn:
          id: 'routine-actions-0'
          optional: true
      - assertNotVisible:
          id: 'routine-actions'
          optional: true
      - tapOn:
          text: 'Delete|删除'
          optional: true
