# Routine builder: create the daily briefings pair on the E2E expert,
# trigger one run now (the proactive turn lands server-side), then delete
# both jobs. Self-cleaning, with an unconditional teardown hook so a
# mid-flow failure cannot poison automation-starters. Requires the E2E
# expert (KMC325). All mutations are scoped to the two briefing rows by
# name — never to arbitrary roster rows.
appId: dev.octop.octopbot
onFlowComplete:
  - runFlow:
      file: subflows/cleanup-briefings.yaml
onFlowError:
  - runFlow:
      file: subflows/cleanup-briefings.yaml
---
- launchApp
- runFlow:
    file: subflows/home-resume.yaml
- tapOn:
    id: 'tab-automation'
- extendedWaitUntil:
    visible:
      id: 'header-compose'
    timeout: 30000
- tapOn:
    id: 'header-compose'
- extendedWaitUntil:
    visible:
      id: 'routine-builder'
    timeout: 15000
- tapOn:
    id: 'routine-expert-KMC325'
- tapOn:
    id: 'routine-schedule-briefings'
- tapOn:
    id: 'routine-create'
# Sheet closes and the roster reloads with the two briefing jobs.
- assertNotVisible:
    id: 'routine-builder'
- extendedWaitUntil:
    visible: 'Morning briefing|早间简报'
    timeout: 30000
- assertVisible: 'Evening briefing|晚间简报'

# Run a briefing now; the outcome is sticky on the row. Long-press targets
# the row by id (the name Text is not independently long-clickable); the
# sheet title is asserted to be a briefing so a stray roster row can never
# be mutated. NOTE: ActionSheet sorts destructive items first, so
# routine-actions-0 = Delete and routine-actions-1 = Run now.
- longPressOn:
    id: 'automation-job-.*'
- extendedWaitUntil:
    visible:
      id: 'routine-actions'
    timeout: 15000
- assertVisible: 'Morning briefing|早间简报|Evening briefing|晚间简报'
- tapOn:
    id: 'routine-actions-1'
- assertNotVisible:
    id: 'routine-actions'
- extendedWaitUntil:
    visible: 'Run started|已触发运行'
    timeout: 15000

# Delete both briefings. Wait the sheet out and assert the confirmation
# alert before tapping its Delete button (same label as the sheet row —
# the wait disambiguates the target).
- longPressOn:
    id: 'automation-job-.*'
- extendedWaitUntil:
    visible:
      id: 'routine-actions'
    timeout: 15000
- assertVisible: 'Morning briefing|早间简报|Evening briefing|晚间简报'
- tapOn:
    id: 'routine-actions-0'
- assertNotVisible:
    id: 'routine-actions'
- assertVisible: 'Delete this routine\?|删除这个定时任务？'
- tapOn: 'Delete|删除'

- longPressOn:
    id: 'automation-job-.*'
- extendedWaitUntil:
    visible:
      id: 'routine-actions'
    timeout: 15000
- assertVisible: 'Morning briefing|早间简报|Evening briefing|晚间简报'
- tapOn:
    id: 'routine-actions-0'
- assertNotVisible:
    id: 'routine-actions'
- assertVisible: 'Delete this routine\?|删除这个定时任务？'
- tapOn: 'Delete|删除'
- assertNotVisible:
    id: 'automation-job-.*'
