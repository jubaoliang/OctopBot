# Chat round-trip: send → assistant reply → terminal composer idle.
# Android baseline (com.tencent.octopbot). Seed a session first when needed:
# octopbot://dev-session?url=…&token=…
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
- tapOn:
    id: 'composer-input'
- inputText: 'ping from maestro'
- tapOn:
    id: 'composer-send'
# After send the draft clears, so idle trailing control is the mic (not send).
# While streaming, stop may appear; wait until the composer is idle again.
# The stop→mic swap lags the streaming flag by a frame, so tolerate the
# transition with a retrying notVisible wait rather than a one-shot assert.
- extendedWaitUntil:
    visible:
      id: 'composer-voice'
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: 'composer-stop'
    timeout: 30000
- assertVisible:
    id: 'composer-input'
