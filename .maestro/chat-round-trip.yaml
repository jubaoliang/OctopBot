# Chat round-trip: send → assistant reply → terminal composer idle.
# Android baseline (dev.octop.octopbot). Seed a session first when needed:
# octopbot://dev-session?url=…&token=…
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
- tapOn:
    id: 'composer-input'
- inputText: 'ping from maestro'
- tapOn:
    id: 'composer-send'
# After send the draft clears, so idle trailing control is the mic (not send).
# While streaming, stop may appear; wait until the composer is idle again.
- extendedWaitUntil:
    visible:
      id: 'composer-voice'
    timeout: 120000
- assertNotVisible:
    id: 'composer-stop'
- assertVisible:
    id: 'composer-input'
