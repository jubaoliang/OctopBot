# Suggested routines: an expert with no cron jobs but server task_examples
# gets a suggestions section; a tap drafts the natural-language schedule in
# a chat with that expert. Requires the E2E expert (KMC325) with no jobs.
appId: com.tencent.octopbot
---
- launchApp
- runFlow:
    file: subflows/home-resume.yaml
- tapOn:
    id: 'tab-automation'
- extendedWaitUntil:
    visible:
      id: 'automation-suggested'
    timeout: 30000
- assertVisible:
    id: 'automation-suggestion-KMC325-0'
# Tap by the schedule sentence, not the row index — the server's example
# order is not a contract.
- tapOn: '(?s)(Every day at 09:00|每天).*'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
# The schedule sentence is drafted, not sent (dotall: the text may wrap).
- assertVisible: '(?s)(Every day at 09:00|每天).*'
- assertVisible:
    id: 'composer-send'
- assertNotVisible:
    id: 'composer-stop'
