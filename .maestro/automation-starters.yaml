# Suggested routines: an expert with no cron jobs but server task_examples
# gets a suggestions section; a tap drafts the natural-language schedule in
# a chat with that expert. Requires the E2E expert (KMC325) with no jobs.
appId: dev.octop.octopbot
---
- launchApp
# The tab bar exists on every tab — wait for the app to render, then reach
# the home if a relaunch restored another tab or a thread.
- extendedWaitUntil:
    visible:
      id: 'tab-chat'
    timeout: 180000
- runFlow:
    when:
      notVisible:
        id: 'select-expert'
    commands:
      - tapOn:
          id: 'tab-chat'
- extendedWaitUntil:
    visible:
      id: 'select-expert'
    timeout: 30000
- tapOn:
    id: 'tab-automation'
- extendedWaitUntil:
    visible:
      id: 'automation-suggested'
    timeout: 30000
- assertVisible:
    id: 'automation-suggestion-KMC325-0'
- tapOn:
    id: 'automation-suggestion-KMC325-0'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
# The schedule sentence is drafted, not sent (dotall: the text may wrap).
- assertVisible: '(?s)(Every day at 09:00|每天).*'
- assertVisible:
    id: 'composer-send'
- assertNotVisible:
    id: 'composer-stop'
