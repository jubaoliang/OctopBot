# Sign-in journey: server address → connection check → credentials → chat home.
# Credentials come from the environment, never the flow file:
#   maestro --device <id> test --env OCTOP_URL=… --env OCTOP_USER=… --env OCTOP_PASS=… .maestro/login.yaml
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'login-url'
    timeout: 60000
- tapOn:
    id: 'login-url'
- eraseText: 120
- inputText: ${OCTOP_URL}
- hideKeyboard
- tapOn:
    id: 'login-next'
- extendedWaitUntil:
    visible:
      id: 'login-username'
    timeout: 30000
- tapOn:
    id: 'login-username'
- eraseText: 120
- inputText: ${OCTOP_USER}
- tapOn:
    id: 'login-password'
- eraseText: 120
- inputText: ${OCTOP_PASS}
- hideKeyboard
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 60000
