# Tab bar behaviour: pressing a focused tab keeps you on that tab, and pops
# its stack back to the root. Used to walk global history and land on the
# first tab instead.
appId: com.tencent.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 180000
- runFlow:
    when:
      notVisible:
        id: 'select-expert'
    commands:
      - tapOn:
          id: 'header-back'

# 1. A second press on Experts stays on Experts.
- tapOn:
    text: '专家|Experts'
- extendedWaitUntil:
    visible:
      id: 'experts-search'
    timeout: 20000
- tapOn:
    text: '专家|Experts'
- assertVisible:
    id: 'experts-search'
- assertNotVisible:
    id: 'composer-input'

# 2. A second press on Me stays on Me.
- tapOn:
    text: '我的|Me'
- extendedWaitUntil:
    visible:
      id: 'me-settings'
    timeout: 15000
- tapOn:
    text: '我的|Me'
- assertVisible:
    id: 'me-settings'
- assertNotVisible:
    id: 'composer-input'

# 3. Inside a thread, pressing the (focused) chat tab returns to the list.
- tapOn:
    text: '对话|Chats'
- extendedWaitUntil:
    visible:
      id: 'select-expert'
    timeout: 15000
- tapOn:
    id: 'header-menu'
- extendedWaitUntil:
    visible:
      id: 'drawer-group-.*'
    timeout: 15000
- tapOn:
    id: 'drawer-group-.*'
- scrollUntilVisible:
    element:
      id: '.*drawer-thread-.*'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: '.*drawer-thread-.*'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
- assertNotVisible:
    id: 'select-expert'
- tapOn:
    text: '对话|Chats'
- extendedWaitUntil:
    visible:
      id: 'select-expert'
    timeout: 15000
