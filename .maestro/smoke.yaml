# Smoke: design UI — chat home, thread view, drawer.
# Dev client dev.octop.octopbot with Metro on :8081 (adb reverse tcp:8081).
# Selectors are exact-match Chinese strings from the Ardot design file.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible: '嗨！你专属的智能伙伴来啦'
    timeout: 180000
- assertVisible: '检查容器状态与资源占用'
- assertVisible: '写运维脚本'
# Suggestion pill → thread screen
- tapOn: '检查容器状态与资源占用'
- assertVisible: '帮我打开腾讯云官网'
- assertVisible: '查看浏览器'
# Back home via tab, then open the drawer
- tapOn: '对话'
- assertVisible: '嗨！你专属的智能伙伴来啦'
- tapOn: 'menu'
- assertVisible: '任务'
- assertVisible: '通用技能'
- assertVisible: '系统医生'
- tapOn: 'close menu'
- assertVisible: '嗨！你专属的智能伙伴来啦'
