# Smoke: logged-in shell — chat home, drawer knowledge/tokens/settings, tabs.
# Dev client dev.octop.octopbot with Metro on :8081 (adb reverse tcp:8081).
# Seed a session first via octopbot://dev-session?url=…&token=… when needed.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
# Chat home greeting or composer placeholder after login
- assertVisible:
    id: 'composer-input'
# Open drawer and confirm navigation rows
- tapOn:
    id: 'header-menu'
- assertVisible:
    id: 'drawer-knowledge'
- assertVisible:
    id: 'drawer-tokens'
- assertVisible:
    id: 'drawer-settings'
# Navigate via drawer (closes it) — tab bar is hidden while a pushed screen is open
- tapOn:
    id: 'drawer-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-version'
    timeout: 30000
- assertVisible:
    id: 'settings-licenses'
# Back to chat home (pushed Settings sits above tabs)
- tapOn:
    id: 'header-back'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
- assertVisible:
    id: 'tab-me'
