# Smoke: logged-in shell — chat home, composer, experts, drawer.
# Dev client dev.octop.octopbot with Metro on :8081 (adb reverse tcp:8081).
# Seed a session first via octopbot://dev-session?url=…&token=… when needed.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
# Chat home greeting or composer placeholder after login
- assertVisible:
    id: 'composer-input'
# Open drawer and confirm navigation rows
- tapOn:
    id: 'header-menu'
- assertVisible:
    id: 'drawer-tokens'
- tapOn:
    id: 'drawer-scrim'
# Experts tab loads without crashing
- tapOn:
    id: 'tab-experts'
- assertNotVisible:
    id: 'composer-input'
- tapOn:
    id: 'tab-chat'
- assertVisible:
    id: 'composer-input'
