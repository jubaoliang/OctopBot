# Smoke: logged-in shell — chat home, composer, experts, drawer.
# Dev client dev.octop.octopbot with Metro on :8081 (adb reverse tcp:8081).
# Seed a session first via octopbot://dev-session?url=…&token=… when needed.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 180000
# Chat home greeting or composer placeholder after login
- assertVisible:
    id: 'composer-input'
# Open drawer and confirm navigation rows
- tapOn:
    id: 'header-menu'
- assertVisible:
    id: 'drawer-tokens'
# Navigate via drawer (closes it) — tab bar is hidden while drawerPresented
- tapOn:
    id: 'drawer-experts'
- assertNotVisible:
    id: 'composer-input'
- assertVisible:
    id: 'header-menu'
# Return to chat home via drawer (more reliable than the floating tab pill)
- tapOn:
    id: 'header-menu'
- tapOn:
    id: 'drawer-chat'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
