# Smoke: app boots, Home renders, Explore tab is reachable.
# Runs against the dev client (dev.octop.octopbot) built with
# `npx expo run:ios` / `npx expo run:android`, Metro on :8081.
# Note: selectors are exact-match; the template title contains a non-breaking
# space ("Welcome to\xa0Expo"), so anchor on plain exact strings.
appId: dev.octop.octopbot
---
- launchApp
- extendedWaitUntil:
    visible: 'GET STARTED'
    timeout: 120000
- assertVisible: 'Try editing'
- assertVisible: 'Fresh start'
- tapOn: 'Explore'
- assertVisible: 'Expo documentation'
- assertVisible: 'File-based routing'
- tapOn: 'Home'
- assertVisible: 'GET STARTED'
