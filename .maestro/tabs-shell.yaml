# Tab shell coverage: Chat / Experts / Automation / Me (+ Settings entry).
# Dev client with a seeded session (octopbot://dev-session when needed).
# Requires at least one expert on the server: the composer's attach control
# only renders once an expert is selected, and a fresh install has no
# persisted last-agent to restore.
appId: com.tencent.octopbot
---
- launchApp
- runFlow:
    file: subflows/home-resume.yaml
- assertVisible:
    id: 'tab-chat'
- assertVisible:
    id: 'tab-experts'
- assertVisible:
    id: 'tab-automation'
- assertVisible:
    id: 'tab-me'

# Select an expert so composer-attach is present regardless of install history.
- tapOn:
    id: 'select-expert'
- extendedWaitUntil:
    visible:
      id: 'expert-sheet'
    timeout: 15000
- tapOn:
    id: 'expert-option-.*'
# The sheet stays mounted through its exit animation with a full-screen
# scrim — wait it out so the next tap is not swallowed by the dismissal.
- assertNotVisible:
    id: 'expert-sheet'

- tapOn:
    id: 'tab-experts'
- extendedWaitUntil:
    visible:
      id: 'experts-list'
    timeout: 30000

- tapOn:
    id: 'tab-automation'
- extendedWaitUntil:
    visible:
      id: 'header-menu'
    timeout: 30000

- tapOn:
    id: 'tab-me'
- extendedWaitUntil:
    visible:
      id: 'me-settings'
    timeout: 30000
- assertVisible:
    id: 'logout'
- tapOn:
    id: 'me-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-version'
    timeout: 30000
- assertVisible:
    id: 'settings-licenses'
- tapOn:
    id: 'header-back'
- extendedWaitUntil:
    visible:
      id: 'me-settings'
    timeout: 30000

- tapOn:
    id: 'tab-chat'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
- assertVisible:
    id: 'composer-attach'
- assertVisible:
    id: 'composer-voice'
